services:
  - type: web
    name: orbit-ops
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run jims:sync
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: JIMS_DATABASE_URL
        sync: false
      - key: JIMS_ADMIN_TOKEN
        sync: false
      - key: JIMS_DEVICE_SECRET
        sync: false
      - key: JIMS_GITHUB_TOKEN
        sync: false
      # Cross-server play with the standalone deployment. Both instances publish
      # their live room codes to the SHARED database and route a join to whichever
      # one hosts the room, so these must be set on both sides or the directory
      # stays empty and every remote code reads as "room not found".
      # PUBLIC_URL must be the launch route, not /tips: the embedded game is behind
      # the access cookie and that route is what mints it.
      - key: CROSS_SERVER_INSTANCE_ID
        value: orbit-embedded
      - key: CROSS_SERVER_PUBLIC_URL
        sync: false
