services:
  - type: web
    name: orbit-ops
    runtime: node
    plan: free
    region: singapore
    buildCommand: pnpm install --frozen-lockfile && pnpm run jims:sync && pnpm run db:migrate
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL_MODE
        value: verify-full
      - key: DATABASE_URL
        sync: false
      # Break-glass moderation. Absent, the /admin route 404s entirely.
      - key: ORBIT_ADMIN_TOKEN
        sync: false
      - key: ORBIT_OWNER_ACCOUNT_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: JIMS_DATABASE_URL
        sync: false
      - key: JIMS_ADMIN_TOKEN
        sync: false
      - key: JIMS_DEVICE_SECRET
        sync: false
      - key: JIMS_GITHUB_TOKEN
        sync: false
      # Cross-server play with the standalone deployment. Both instances publish
      # their live room codes to the SHARED database and route a join to whichever
      # one hosts the room, so these must be set on both sides or the directory
      # stays empty and every remote code reads as "room not found".
      # PUBLIC_URL may be either the launch route or /tips itself: an arriving
      # invite carries a one-time room handoff, and the gateway mints the access
      # cookie for it at whichever of the two doors it knocks on.
      - key: CROSS_SERVER_INSTANCE_ID
        value: orbit-embedded
      - key: CROSS_SERVER_PUBLIC_URL
        sync: false
