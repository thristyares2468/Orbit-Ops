services:
  - type: web
    name: orbit-ops
    runtime: node
    plan: free
    region: singapore
    buildCommand: pnpm install --frozen-lockfile && pnpm run subdivision:install && pnpm run db:migrate
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL_MODE
        value: verify-full
      - key: DATABASE_URL
        sync: false
      # Break-glass moderation. Absent, the /admin route 404s entirely.
      - key: ORBIT_ADMIN_TOKEN
        sync: false
      - key: ORBIT_OWNER_ACCOUNT_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Exact Cloudflare Pages origin, optionally followed by the project-scoped
      # preview wildcard. Add this manually on existing Blueprint services.
      - key: PUBLIC_CLIENT_ORIGINS
        sync: false
      - key: SUBDIVISION_DATABASE_URL
        sync: false
      - key: SUBDIVISION_ADMIN_TOKEN
        sync: false
      - key: SUBDIVISION_DEVICE_SECRET
        sync: false
