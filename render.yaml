services:
  - type: web
    name: orbit-ops
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run jims:sync
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: JIMS_DATABASE_URL
        sync: false
      - key: JIMS_ADMIN_TOKEN
        sync: false
      - key: JIMS_DEVICE_SECRET
        sync: false
